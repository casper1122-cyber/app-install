<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>資產配置｜資料品質測試</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#23372f;background:#f5f7f4}
*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:24px 16px 64px}
h1{font-size:1.5rem;margin:0 0 8px}p{line-height:1.65}.muted{color:#65746a}
nav{display:flex;justify-content:space-between;gap:12px;align-items:center}
button{background:#245b48;color:white;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;font-size:1rem}
.card{background:white;border:1px solid #d9e3dc;padding:18px;border-radius:16px;margin:12px 0}
.row{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:1px solid #edf0ee;padding:12px 0}
.row:last-child{border:0}.pill{border-radius:999px;padding:3px 10px;background:#ecf0ed;font-size:.85rem;white-space:nowrap}
.warn{background:#fff0d6;color:#79500b}.bad{background:#fce9e9;color:#9d3026}.good{background:#e5f5e9;color:#236a42}
small{color:#65746a;display:block;margin-top:4px}dl{display:grid;grid-template-columns:1fr 1fr;gap:12px}dt{color:#65746a;font-size:.85rem}dd{margin:4px 0;font-weight:650;font-size:1.1rem}
details{margin-top:10px}summary{cursor:pointer}a{color:#206147}
</style></head><body><main>
<nav><h1>資料品質檢查</h1><button id="reload">重新檢查</button></nav>
<p class="muted">測試用唯讀工具。僅顯示真實更新狀態與資料完整性，不評級、不修改資產、不以缺資料推定零風險。</p>
<section class="card"><h2>最新資料</h2><dl><div><dt>狀態更新時間</dt><dd id="at">讀取中</dd></div><div><dt>資料程式版本</dt><dd id="ver">—</dd></div><div><dt>回測最後月份</dt><dd id="last">—</dd></div><div><dt>未完成／需處理</dt><dd id="badcount">—</dd></div></dl><p id="summary" aria-live="polite"></p></section>
<section class="card"><h2>各資料來源</h2><div id="sources" aria-live="polite">讀取中…</div></section>
<section class="card"><h2>回測資料檢查</h2><div id="checks">讀取中…</div></section>
<p class="muted">說明：此頁只驗證基本結構、欄位與來源狀態；不代表模型的經濟假設、預測精度或樣本外回測已通過。</p>
</main><script>
"use strict";
const ROOT="https://casper1122-cyber.github.io/app-install/";
const $=id=>document.getElementById(id), safe=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function line(title,state,detail){const cls=state==="正常"?"good":state==="需處理"?"bad":"warn";return '<div class="row"><div><strong>'+safe(title)+'</strong><small>'+safe(detail)+'</small></div><span class="pill '+cls+'">'+safe(state)+'</span></div>'}
async function get(path){const r=await fetch(ROOT+path+"?ts="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error(path+": HTTP "+r.status);return r.json()}
function validateRate(r){const issues=[];if(!/^\d{4}-\d{2}$/.test(r.last||""))issues.push("最後回測月份不存在");if(!r.a||!Object.keys(r.a).length)issues.push("缺少資產月報酬資料");
if(!Array.isArray(r.cpi)||!r.cpi.length)issues.push("缺少 CPI 月報酬");
const base=r.base;for(const [code,a] of Object.entries(r.a||{})){if(!/^\d{4}-\d{2}$/.test(a.s||"")||!Array.isArray(a.r)){issues.push(code+" 起始月份或報酬資料不完整");continue}
if(a.r.some(x=>!Number.isFinite(x)))issues.push(code+" 包含 null 或非數字：應明確處理缺值");
if(a.r.length===0)issues.push(code+" 沒有觀測月份");
}
if(r.upd?.est?.length)issues.push("資料發布者標示估計："+r.upd.est.join("、"));
if(r.upd?.bad?.length)issues.push("資料發布者標示缺漏："+r.upd.bad.join("、"));
return issues}
async function run(){
$("summary").textContent="正在確認公開資料…";
try{const [s,r]=await Promise.all([get("data/status.json"),get("rate/latest.json")]);
$("at").textContent=s.at||"未標示";$("ver").textContent=s.ver||"未標示";$("last").textContent=r.last||"未標示";
const items=Array.isArray(s.items)?s.items:[];const problematic=items.filter(x=>["fail","need-user","manual-due","new"].includes(x.state));
$("badcount").textContent=problematic.length+" 項";
$("sources").innerHTML=items.map(x=>line(x.name||x.id,x.state==="ok"?"正常":["later","est"].includes(x.state)?"需留意":"需處理","狀態："+(x.state||"未知")+"；最近："+(x.last||"無")+"；"+(x.msg||""))).join("")||"未找到資料來源";
const issues=validateRate(r);
$("checks").innerHTML=issues.length?issues.map(x=>line("資料完整性","需留意",x)).join(""):line("結構檢查","正常","沒有偵測到已定義的結構問題；不等於實證模型通過");
$("summary").textContent="已取得公開資料；"+problematic.length+" 項更新狀態需處理，"+issues.length+" 項回測資料訊息待核對。";
}catch(e){$("summary").textContent="無法驗證公開資料："+e.message;$("sources").textContent="未能讀取";$("checks").textContent="未能讀取";}
}
$("reload").addEventListener("click",run);run();
</script></body></html>
