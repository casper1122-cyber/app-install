<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5a3f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>資產配置</title>
<style>
  html, body { margin:0; height:100%; background:#1f5a3f; overflow:hidden; }
  #f { position:fixed; inset:0; width:100%; height:100%; border:0; background:#fff; visibility:hidden; }
  #splash { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:#fff; font-family:-apple-system,"Noto Sans TC",sans-serif; text-align:center; padding:24px; }
  #splash img { width:96px; height:96px; border-radius:22px; }
  #splash a { color:#fff; font-size:14px; opacity:.85; }
</style>
</head>
<body>
<!-- Android 裝好之後從這一頁開始：把 App 放在全螢幕的框裡，這樣就沒有網址列。
     框裡的 App 出來時會通知這一頁；等了一陣子都沒通知（還沒登入 Google、瀏覽器擋第三方 Cookie…），就改成直接跳過去（會有一小條網址列，但一定能用）。 -->
<div id="splash"><img src="icon-192.png" alt=""><div id="msg">開啟中…</div><a id="direct" href="#">等很久？按這裡直接開啟</a></div>
<iframe id="f" allow="camera *; clipboard-read *; clipboard-write *; web-share *; fullscreen *" referrerpolicy="origin"></iframe>
<script>
  var APP = "https://script.google.com/macros/s/AKfycbx042OQj64SXi_RAVY-joWC7rEnAxYhPX3q_NcZ9WcL_hSwpJ8OnnZY0_QjPscGULMq/exec";
  var WAIT = 15000, done = false, f = document.getElementById("f");
  function direct() { if (done) return; done = true; location.replace(APP); }
  document.getElementById("direct").onclick = function (e) { e.preventDefault(); direct(); };
  window.addEventListener("message", function (e) {
    var m = e.data;
    if (done || !m || m.src !== "zichan-app" || m.type !== "ready") return;
    if (!/^https:\/\/([a-z0-9-]+\.googleusercontent\.com|script\.google\.com)$/.test(e.origin)) return;
    done = true;
    f.style.visibility = "visible";
    document.getElementById("splash").style.display = "none";
  });
  // 上次試過框不起來的話，這次就直接跳，不要每次都讓人等
  var skip = false;
  try { skip = Number(localStorage.getItem("embedFail") || 0) > Date.now() - 6 * 3600 * 1000; } catch (e) {}
  if (skip) direct();
  else {
    f.src = APP;
    setTimeout(function () {
      if (done) { try { localStorage.removeItem("embedFail"); } catch (e) {} return; }
      try { localStorage.setItem("embedFail", String(Date.now())); } catch (e) {}
      direct();
    }, WAIT);
  }
</script>
</body>
</html>
