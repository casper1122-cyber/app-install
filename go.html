<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140C07">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preload" href="lamp/poster.jpg" as="image">
<title>Casper資產配置</title>
<style>
  html, body { margin:0; height:100%; background:#140C07; overflow:hidden; }
  #f { position:fixed; inset:0; width:100%; height:100%; border:0; background:#ECE5D8; visibility:hidden; opacity:0; transition:opacity .5s ease; }
  /* 陶燈程式還沒到之前：先放同一張畫（不黑） */
  #pre { position:fixed; inset:0; background:#140C07 url("lamp/poster.jpg") center/cover; }
</style>
</head>
<body>
<!-- 裝好之後從這一頁開始：把 App 放在全螢幕的框裡，這樣就沒有網址列。
     開啟畫面＝陶燈油畫（lamp/lamp.js，預算幀、不用即時濾鏡）；App 在背景載入。
     新版 App 會說「畫面好了」（shown）或「要輸入密碼」（lock），這時才轉場；舊版 App 只說 ready，就照舊在 ready 時進去。
     框裡開不起來（還沒登入 Google、瀏覽器擋第三方 Cookie…）：燈淡成模糊背景、浮出登入卡，按「使用 Google 繼續」才整頁開 App（會有一小條網址列，但一定能用），
     不再跑到一半突然跳去 Google 登入（使用者 2026-11-13）。 -->
<div id="pre" role="img" aria-label="一盞點亮的陶燈，油畫"></div>
<iframe id="f" title="資產配置" allow="camera *; clipboard-read *; clipboard-write *; web-share *; fullscreen *" referrerpolicy="origin"></iframe>
<script src="lamp/lamp.js"></script>
<script>
  var APP = "https://script.google.com/macros/s/AKfycbx042OQj64SXi_RAVY-joWC7rEnAxYhPX3q_NcZ9WcL_hSwpJ8OnnZY0_QjPscGULMq/exec";
  // 測試用：?app=dev 開測試版（/dev 只有擁有者能開）
  if (/[?&]app=dev\b/.test(location.search)) APP = "https://script.google.com/macros/s/AKfycbzmmtP_g2YayfdQfHQwG6xGXX0akdo13YHeqhsdQVQ/dev";
  var WAIT = 10000, SHOWN_WAIT = 25000, done = false, entered = false, f = document.getElementById("f"), L = null;
  try { L = window.KLamp ? KLamp.mount(document.body) : null; } catch (eL) { L = null; }
  if (L) { document.getElementById("pre").remove(); L.status("開啟中…"); }
  function needSign() {   // 框裡開不起來：記住 6 小時（下次直接出登入卡），請使用者自己按
    if (done || entered) return; done = true;
    try { localStorage.setItem("embedFail", String(Date.now())); } catch (e) {}
    if (L && L.signin) L.signin(direct); else direct();
  }
  // 框載完了卻沒聽到 App 說 ready（多半是被導去 Google 登入頁、而登入頁不能放在框裡）
  f.addEventListener("load", function () { if (f.src) setTimeout(function () { if (!done) needSign(); }, 2500); });
  function direct() { if (entered) return; entered = true; done = true; location.replace(APP); }
  function reveal() {
    if (entered) return; entered = true;
    var show = function () { f.style.visibility = "visible"; f.style.opacity = 1; var p = document.getElementById("pre"); if (p) p.remove(); };
    if (L) L.enter(show); else show();
  }
  window.addEventListener("message", function (e) {
    var m = e.data;
    if (!m || m.src !== "zichan-app") return;
    if (!/^https:\/\/([a-z0-9-]+\.googleusercontent\.com|script\.google\.com)$/.test(e.origin)) return;
    // App 裡按了「更新」：把框重新載入一次（拿到新版程式，還是全螢幕）
    if (m.type === "reload") { if (f.src) { f.src = APP; } return; }
    // App 裡有幾件事要處理：App 圖示右上角顯示數字（手機、電腦支援的才會有）
    if (m.type === "badge") { try { var n = Number(m.n) || 0; if (navigator.setAppBadge) { if (n > 0) navigator.setAppBadge(n); else navigator.clearAppBadge(); } } catch (be) {} return; }
    if (m.type === "ready") {
      if (!done) { done = true; try { localStorage.removeItem("embedFail"); } catch (e1) {} }
      if (!m.v) return reveal();   // 舊版 App：不會再通知，照舊在這時進去
      if (L) L.status("載入資料…");
      setTimeout(reveal, SHOWN_WAIT);   // 新版 App 理應很快說 shown／lock；萬一沒說，也不讓人一直等
      return;
    }
    if (m.type === "shown" || m.type === "lock") { done = true; reveal(); }
  });
  // 上次試過框不起來的話，這次就直接跳，不要每次都讓人等
  var skip = false;
  try { skip = Number(localStorage.getItem("embedFail") || 0) > Date.now() - 6 * 3600 * 1000; } catch (e) {}
  if (skip) setTimeout(needSign, 700);   // 這台最近框不起來：燈亮一下就出登入卡
  else {
    f.src = APP;
    setTimeout(needSign, WAIT);
  }
</script>
</body>
</html>
