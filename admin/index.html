<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5f4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="資產後台">
<meta name="robots" content="noindex">
<title>資產配置後台</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-192.png">
<style>
:root {
  --bg: #f3f5f4; --card: #fff; --text: #1d2b26; --muted: #6b7a74; --line: #e2e8e5;
  --brand: #1f5f4a; --brand-soft: #e3f0ea; --bad: #b3261e; --bad-soft: #fbe9e7; --warn: #8a5a00; --warn-soft: #fff4dc; --ok: #1e7a4f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101614; --card: #19211e; --text: #e6efeb; --muted: #93a39c; --line: #2a3531;
    --brand: #6fc6a3; --brand-soft: #1c3329; --bad: #ff8a80; --bad-soft: #3a1f1d; --warn: #ffcc66; --warn-soft: #3a3020; --ok: #6fd6a0;
  }
}
:root[data-theme="dark"] {
  --bg: #101614; --card: #19211e; --text: #e6efeb; --muted: #93a39c; --line: #2a3531;
  --brand: #6fc6a3; --brand-soft: #1c3329; --bad: #ff8a80; --bad-soft: #3a1f1d; --warn: #ffcc66; --warn-soft: #3a3020; --ok: #6fd6a0;
}
:root { --head: #1f5f4a; }
body.hasbg { background: transparent; }
body.hasbg::before { content: ""; position: fixed; inset: 0; z-index: -1; background-color: var(--bg); background-image: linear-gradient(rgba(0,0,0,var(--dim,.35)), rgba(0,0,0,var(--dim,.35))), var(--bgimg); background-size: cover; background-position: center; }
.swatch { width: 38px; height: 38px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; padding: 0; flex: 0 0 auto; }
.swatch.on { border-color: var(--text); }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
body { padding: env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom)); }
.wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
header { background: var(--head); color: #fff; padding: calc(14px + env(safe-area-inset-top)) 16px 14px; margin-top: calc(-1 * env(safe-area-inset-top)); }
header .in { max-width: 760px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
header h1 { font-size: 18px; margin: 0; }
header small { opacity: .8; font-size: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.card h2 { font-size: 16px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.label, .muted { color: var(--muted); font-size: 13px; }
label.f { display: block; margin-bottom: 10px; font-size: 13px; color: var(--muted); }
input[type=text], input[type=password], input[type=email], input[type=url], textarea, select {
  width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; margin-top: 4px; }
textarea { min-height: 90px; resize: vertical; }
button { font: inherit; cursor: pointer; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 10px; padding: 11px 16px; background: var(--brand); color: #fff; font-weight: 700; }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 600; }
.btn.bad { background: var(--bad); }
.btn.sm { padding: 6px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.full { width: 100%; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > * { flex: 1; min-width: 0; }
.pill { display: inline-block; font-size: 12px; border-radius: 99px; padding: 2px 8px; background: var(--brand-soft); color: var(--brand); white-space: nowrap; }
.pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.warn { background: var(--warn-soft); color: var(--warn); }
.item { border-top: 1px solid var(--line); padding: 10px 0; }
.item:first-of-type { border-top: 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
.kv b { text-align: right; font-weight: 600; word-break: break-all; }
pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; background: var(--bg); border-radius: 8px; padding: 8px; margin: 6px 0 0; }
nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); display: flex; overflow-x: auto; padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
nav button { flex: 1 1 0; min-width: 0; background: none; border: 0; color: var(--muted); padding: 8px 6px 10px; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; }
nav button .ic { font-size: 19px; }
nav button.on { color: var(--brand); font-weight: 700; }
nav .dot { position: absolute; top: 6px; right: 14px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
.hidden { display: none !important; }
#toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; max-width: calc(100% - 32px); font-size: 14px; z-index: 20; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.show { opacity: 1; } #toast.err { background: var(--bad); color: #fff; }
.center { max-width: 400px; margin: 40px auto; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -2px; }
@keyframes sp { to { transform: rotate(360deg); } }
.filemap { border: 1px dashed var(--line); border-radius: 10px; padding: 10px; margin: 8px 0; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; margin: 8px 0; }
.check input { margin-top: 4px; width: 18px; height: 18px; }
a { color: var(--brand); }
</style>
</head>
<body>
<header><div class="in"><div><h1>資產配置後台</h1><small id="hdrSub">管理員專用</small></div><button class="btn ghost sm hidden" id="btnLogout" style="color:#fff;border-color:rgba(255,255,255,.4)">登出</button></div></header>
<div class="wrap" id="main"></div>
<nav id="nav" class="hidden"></nav>
<div id="toast"></div>
<script>
// ============================================================
// 後台網頁：所有資料都向「後台 Apps Script」要（網址存在這台裝置），登入憑證也只存在這台裝置
// ============================================================
var $ = function (id) { return document.getElementById(id); };
// 出錯時顯示在畫面上（不然只會一片空白）
window.addEventListener("error", function (e) {
  try { var m = document.getElementById("main"); if (m && !m.textContent.trim()) m.innerHTML = '<div class="card center"><h2>頁面出錯了</h2><div class="label" style="word-break:break-all">' + String(e.message || e) + "（第 " + (e.lineno || "?") + " 行）</div><button class=\"btn\" onclick=\"location.reload()\" style=\"margin-top:10px\">重新整理</button></div>"; } catch (x) {}
});
// 比版本：2026.10.52m（年.月.號碼＋字母）；a 比 b 舊回傳負數，看不懂回傳 0
function verCmp(a, b) {
  var p = function (v) { var m = String(v || "").match(/^(\d+)\.(\d+)\.(\d+)([a-z]*)$/); return m ? [Number(m[1]), Number(m[2]), Number(m[3]), m[4]] : null; };
  var x = p(a), y = p(b); if (!x || !y) return 0;
  for (var i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] - y[i];
  if (x[3].length !== y[3].length) return x[3].length - y[3].length;
  return x[3] < y[3] ? -1 : x[3] > y[3] ? 1 : 0;
}
var esc = function (s) { return String(s === undefined || s === null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
var store = {
  get: function (k) { try { return localStorage.getItem(k) || sessionStorage.getItem(k) || ""; } catch (e) { return ""; } },
  set: function (k, v, keep) { try { (keep ? localStorage : sessionStorage).setItem(k, v); } catch (e) {} },
  del: function (k) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) {} }
};
var S = { url: store.get("adm_url"), token: store.get("adm_token"), tab: "deploy", cfg: {}, info: null };
var device = (function () { var u = navigator.userAgent; return (/iPhone/.test(u) ? "iPhone" : /iPad/.test(u) ? "iPad" : /Android/.test(u) ? "Android" : /Mac/.test(u) ? "Mac" : /Windows/.test(u) ? "Windows" : "其他") + "・" + (/CriOS|Chrome/.test(u) ? "Chrome" : /Safari/.test(u) ? "Safari" : /Firefox/.test(u) ? "Firefox" : "瀏覽器"); })();

function toast(msg, err) {
  var t = $("toast"); t.textContent = msg; t.className = "show" + (err ? " err" : "");
  clearTimeout(toast.t); toast.t = setTimeout(function () { t.className = ""; }, err ? 5000 : 2600);
}
// 呼叫後台（用 text/plain，瀏覽器不會先問一次，Apps Script 才收得到）
function api(op, arg) {
  if (!S.url) return Promise.reject("還沒設定後台網址");
  if (/^(deploy|hotfix|upload|rollback|autoSet|fixAccess|logout|logoutAll)$/.test(op)) store.del("adm_dep"); // 狀態會變：上次存的不能再拿來先顯示
  return fetch(S.url, { method: "POST", body: JSON.stringify({ op: op, arg: arg || {}, token: S.token }), redirect: "follow" })
    .then(function (r) { return r.text(); })
    .then(function (t) {
      var j; try { j = JSON.parse(t); } catch (e) { throw "後台沒有正常回覆，請確認後台網址對不對、後台有沒有部署成「任何人」都能使用"; }
      if (!j.ok) { if (j.relogin) { S.token = ""; store.del("adm_token"); showLogin(); } throw j.error || "失敗"; }
      return j.data;
    }, function () { throw "連不到後台，請檢查網路或後台網址"; });
}
function hub(op, arg) { return api("hub", { op: op, arg: arg || {} }); }
function busy(btn, on, text) { if (!btn) return; if (on) { btn.dataset.t = btn.innerHTML; btn.innerHTML = '<span class="spin"></span> ' + (text || "處理中"); btn.disabled = true; } else { btn.innerHTML = btn.dataset.t || btn.innerHTML; btn.disabled = false; } }

// ---------- 開始 ----------
function start() {
  if (!S.url) return showUrl();
  $("main").innerHTML = '<div class="card center"><span class="spin"></span> 連線到後台中…<div class="label" style="margin-top:6px">第一次可能要等 5～10 秒</div></div>';
  var slow = setTimeout(function () {
    if ($("main").textContent.indexOf("連線到後台中") >= 0) $("main").innerHTML = '<div class="card center"><span class="spin"></span> 還在等後台回應…<div class="label" style="margin-top:6px">網路比較慢，或後台網址不對</div><div class="row" style="margin-top:12px"><button class="btn" onclick="start()">再試一次</button><button class="btn ghost" onclick="showUrl()">改後台網址</button></div></div>';
  }, 15000);
  api("status").then(function (d) { clearTimeout(slow); return d; }, function (e) { clearTimeout(slow); throw e; }).then(function (d) { if (!d.ready) showSetup(); else if (!S.token) showLogin(); else enter(); })
    .catch(function (e) { $("main").innerHTML = '<div class="card center"><h2>連不到後台</h2><div class="label">' + esc(e) + '</div><div class="row" style="margin-top:12px"><button class="btn" onclick="start()">再試一次</button><button class="btn ghost" onclick="showUrl()">改後台網址</button></div></div>'; });
}
function showUrl() {
  hideNav();
  $("main").innerHTML = '<div class="card center"><h2>連接後台</h2><div class="label" style="margin-bottom:10px">貼上「資產配置後台」Apps Script 部署後的網址（…/exec）。只需要設定一次，存在這台裝置。</div>' +
    '<label class="f">後台網址<input type="url" id="uIn" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(S.url) + '"></label><button class="btn full" id="uOk">連接</button></div>';
  $("uOk").onclick = function () {
    var v = $("uIn").value.trim();
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(v)) return toast("網址格式不對，要是 https://script.google.com/macros/s/…/exec", true);
    S.url = v; store.set("adm_url", v, true); start();
  };
}
function showSetup() {
  hideNav();
  $("main").innerHTML = '<div class="card center"><h2>第一次設定</h2><div class="label" style="margin-bottom:10px">在後台的 Apps Script 編輯器選「showSetupCode」按執行，把執行紀錄裡的 8 碼設定碼填在這裡（30 分鐘內有效）。</div>' +
    '<form id="sf" autocomplete="on"><label class="f">設定碼<input type="text" id="sCode" autocomplete="off" autocapitalize="characters"></label>' +
    '<label class="f">帳號（之後登入用）<input type="text" id="sUser" name="username" autocomplete="username" autocapitalize="none"></label>' +
    '<label class="f">密碼（至少 10 個字，要有英文和數字）<input type="password" id="sPass" name="new-password" autocomplete="new-password"></label>' +
    '<label class="f">再輸入一次密碼<input type="password" id="sPass2" autocomplete="new-password"></label>' +
    '<button class="btn full" id="sOk" type="submit">建立帳號</button></form><div class="label" style="margin-top:10px">手機會問要不要記住密碼，選「記住」，之後登入就可以用臉部辨識或指紋。</div></div>';
  $("sf").onsubmit = function (e) {
    e.preventDefault();
    if ($("sPass").value !== $("sPass2").value) return toast("兩次密碼不一樣", true);
    var b = $("sOk"); busy(b, true);
    api("setup", { code: $("sCode").value, user: $("sUser").value, pass: $("sPass").value, device: device })
      .then(function () { toast("設定完成，請登入"); store.set("adm_user", $("sUser").value.trim(), true); showLogin(); })
      .catch(function (err) { toast(err, true); busy(b, false); });
  };
}
function showLogin() {
  hideNav(); $("btnLogout").classList.add("hidden");
  var u = store.get("adm_user");
  $("main").innerHTML = '<div class="card center"><h2>登入</h2>' +
    '<form id="lf" method="post" action="#"><label class="f">帳號<input type="text" id="lUser" name="username" autocomplete="username" autocapitalize="none" value="' + esc(u) + '"></label>' +
    '<label class="f">密碼<input type="password" id="lPass" name="password" autocomplete="current-password"></label>' +
    '<div class="check"><input type="checkbox" id="lRem" checked><label for="lRem">記住我（這台裝置 30 天內不用再登入）</label></div>' +
    '<button class="btn full" id="lOk" type="submit">登入</button></form>' +
    '<div class="label" style="margin-top:10px">點密碼欄，手機會跳出儲存的密碼，用臉部辨識或指紋確認就會自動填好。</div>' +
    '<div style="margin-top:14px;text-align:center"><a href="#" onclick="showUrl();return false" class="label">改後台網址</a></div></div>' + installCard();
  if (u) setTimeout(function () { $("lPass") && $("lPass").focus(); }, 300);
  installBind();
  $("lf").onsubmit = function (e) {
    e.preventDefault();
    var b = $("lOk"); busy(b, true, "登入中");
    var rem = $("lRem").checked;
    api("login", { user: $("lUser").value, pass: $("lPass").value, remember: rem, device: device }).then(function (d) {
      S.token = d.token; store.del("adm_token"); store.set("adm_token", d.token, rem); store.set("adm_user", d.user, true);
      enter();
    }).catch(function (err) { toast(err, true); busy(b, false); });
  };
}
$("btnLogout").onclick = function () {
  if (!confirm("登出這台裝置？")) return;
  api("logout").catch(function () {}).then(function () { S.token = ""; store.del("adm_token"); showLogin(); });
};

// ---------- 登入之後 ----------
var TABS = [["deploy", "🚀", "部署"], ["todo", "📅", "待辦"], ["users", "👥", "使用者"], ["invites", "✉️", "邀請"], ["errors", "🐞", "錯誤"], ["data", "📡", "資料"], ["feedback", "💬", "意見"], ["ann", "📢", "公告"], ["logs", "🔐", "紀錄"], ["cfg", "⚙️", "設定"]];
function hideNav() { $("nav").classList.add("hidden"); }
function enter() {
  $("btnLogout").classList.remove("hidden");
  $("nav").classList.remove("hidden");
  $("nav").innerHTML = TABS.map(function (t) { return '<button data-t="' + t[0] + '"><span class="ic">' + t[1] + "</span>" + t[2] + (t[0] === "feedback" ? '<span class="dot hidden" id="fbDot"></span>' : t[0] === "errors" ? '<span class="dot hidden" id="erDot"></span>' : t[0] === "todo" ? '<span class="dot hidden" id="tdDot"></span>' : t[0] === "data" ? '<span class="dot hidden" id="dtDot"></span>' : "") + "</button>"; }).join("");
  $("nav").querySelectorAll("button").forEach(function (b) { b.onclick = function () { go(b.dataset.t); }; });
  api("me").then(function (d) { S.cfg = d.cfg; try { themeSync(d.theme); } catch (te) {} $("hdrSub").textContent = "已登入：" + d.user; if (!d.cfg.scriptId || !d.cfg.hubUrl) { toast("先到「設定」填中央 App 的資料"); go("cfg"); } else go(S.tab); })
    .catch(function (e) { toast(e, true); });
  // 實價登錄該更新了：跳視窗提醒（每次登入提醒一次）
  api("reData").then(function (r) { if (r && r.ok && r.monthNeed) { $("tdDot").classList.remove("hidden"); rePopup(r); } }).catch(function () {});
  // 有沒有沒看過的意見／錯誤（小紅點）
  hub("feedback").then(function (d) { if ((d.list || []).some(function (f) { return !f.read; })) $("fbDot").classList.remove("hidden"); }).catch(function () {});
  hub("dataStatus").then(function (d) { if (d.issues && d.issues.length) $("dtDot").classList.remove("hidden"); }).catch(function () {});
  hub("errors").then(function (d) { var seen = store.get("adm_errseen"); if ((d.list || []).some(function (x) { return x._k > seen; })) $("erDot").classList.remove("hidden"); }).catch(function () {});
}
function go(t) {
  S.tab = t;
  $("nav").querySelectorAll("button").forEach(function (b) { b.classList.toggle("on", b.dataset.t === t); });
  $("main").innerHTML = '<div class="card"><span class="spin"></span> 讀取中…</div>';
  window.scrollTo(0, 0);
  ({ deploy: tDeploy, todo: tTodo, users: tUsers, invites: tInvites, errors: tErrors, data: tData, feedback: tFeedback, ann: tAnn, logs: tLogs, cfg: tCfg })[t]();
}
function fail(e) { $("main").innerHTML = '<div class="card"><h2>讀取失敗</h2><div class="label">' + esc(e) + '</div><button class="btn ghost" style="margin-top:10px" onclick="go(S.tab)">再試一次</button></div>'; }

// ---------- 🏠 實價登錄估價資料（每季提醒更新） ----------
function reSeasonText(s) { return s ? String(parseInt(s, 10)) + " 年第 " + String(s).slice(-1) + " 季" : "—"; }
function reDataCard() {
  api("reData").then(function (r) {
    var el = $("reCard"); if (!el) return;
    if (!r.ok) { el.innerHTML = '<div class="card"><h2>🏠 實價登錄資料</h2><div class="label">' + esc(r.why) + "</div></div>"; return; }
    var need = r.monthNeed;
    var h = '<div class="card"' + (need ? ' style="border:2px solid var(--warn,#d97706)"' : "") + '><h2>🏠 實價登錄資料 ' + (need ? '<span class="pill warn">該更新了</span>' : '<span class="pill">最新</span>') + "</h2>" +
      '<div class="kv"><span>成交資料到</span><b>' + esc(r.through) + "（預售屋 " + esc(r.pthrough) + "）</b><span>內政部應該已經有</span><b>" + esc(r.expect) + "</b><span>" + (need ? "要處理" : "下次更新") + "</span><b>" + esc(r.nextDue) + "</b></div>";
    h += need ? '<div class="row" style="margin-top:10px"><button class="btn full" id="reHow">怎麼更新</button></div>' : '<div class="label" style="margin-top:8px">每月 11 日以後內政部會公布上個月的成交，到時這裡和登入時會提醒你，也可以在「📅 待辦」加到 Google 日曆。</div>';
    el.innerHTML = h + "</div>";
    if ($("reHow")) $("reHow").onclick = function () { rePopup(r); };
  }).catch(function () {});
}
// 跳視窗：實價登錄該更新了
function rePopup(r) {
  var w = document.createElement("div");
  w.id = "rePop"; w.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px";
  w.innerHTML = '<div class="card" style="max-width:440px;width:100%;margin:0;border:2px solid var(--warn,#d97706)"><h2>🏠 該更新實價登錄資料了</h2>' +
    '<div style="line-height:1.7">App 的估價資料只到 <b>' + esc(r.through) + "</b>，內政部已經公布到 <b>" + esc(r.expect) + "</b> 了。每月更新一次，估價才抓得到最新的行情變化。</div>" +

}

// ---------- 外觀（存在這台裝置） ----------
var THEMES = [["綠", "#1f5f4a"], ["藍", "#1e4fa3"], ["靛", "#3b3f9e"], ["紫", "#6a3fa0"], ["粉", "#b0306a"], ["紅", "#a3322b"], ["橘", "#b4581b"], ["金", "#8a6a12"], ["灰", "#3d4650"], ["黑", "#15181c"]];
var T = { brand: "#1f5f4a", mode: "", bg: "", dim: 0.35, own: false, sv: 0, bgId: "" };
try { var t0 = JSON.parse(localStorage.getItem("adm_theme") || "null"); if (t0) T = Object.assign(T, t0); } catch (e) {}
function mix(hex, w, a) { // hex 跟白色（w=255）或黑色（w=0）混 a 比例
  var n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  var f = function (c) { return Math.round(c + (w - c) * a); };
  return "#" + [f(r), f(g), f(b)].map(function (c) { return ("0" + c.toString(16)).slice(-2); }).join("");
}
function themeApply() {
  var root = document.documentElement, dark = T.mode === "dark" || (!T.mode && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  if (T.mode) root.setAttribute("data-theme", T.mode); else root.removeAttribute("data-theme");
  root.style.setProperty("--head", T.brand);
  root.style.setProperty("--brand", dark ? mix(T.brand, 255, 0.45) : T.brand);
  root.style.setProperty("--brand-soft", dark ? mix(T.brand, 0, 0.65) : mix(T.brand, 255, 0.86));
  var mt = document.querySelector('meta[name="theme-color"]'); if (mt) mt.setAttribute("content", T.brand);
  document.body.classList.toggle("hasbg", !!T.bg);
  if (T.bg) { document.body.style.setProperty("--bgimg", "url(" + T.bg + ")"); document.body.style.setProperty("--dim", String(T.dim)); }
  else document.body.style.removeProperty("--bgimg");
}
function themeLocal() { try { localStorage.setItem("adm_theme", JSON.stringify(T)); } catch (e) { toast("這台裝置存不下（圖片太大？），只有這次有效", true); } }
// 存起來；沒有勾「這台用自己的」就同步到後台（withBg＝背景圖也有改）
var THEME_TIMER = null;
function themeSave(withBg) {
  themeLocal(); themeApply();
  if (T.own || !S.token) return;
  clearTimeout(THEME_TIMER);
  var arg = { brand: T.brand, mode: T.mode, dim: T.dim };
  if (withBg) arg.bg = T.bg;
  THEME_TIMER = setTimeout(function () {
    api("themeSet", arg).then(function (m) { T.sv = m.theme.ver; T.bgId = m.theme.bgId || ""; themeLocal(); })
      .catch(function (e) { toast("外觀沒有同步到其他裝置：" + e, true); });
  }, withBg ? 0 : 700);
}
// 登入後：別台裝置改過外觀，就套用（背景圖有變才下載）
function themeSync(meta) {
  if (T.own || !meta || meta.ver === T.sv) return;
  var apply = function (bg) {
    T.brand = meta.brand || T.brand; T.mode = meta.mode || ""; T.dim = meta.dim === undefined ? T.dim : meta.dim;
    if (bg !== undefined) { T.bg = bg; T.bgId = meta.bgId || ""; }
    T.sv = meta.ver; themeLocal(); themeApply();
    if (S.tab === "cfg" && $("thSw")) go("cfg");
  };
  if ((meta.bgId || "") === (T.bgId || "")) return apply();
  if (!meta.bgId) return apply("");
  api("themeGet").then(function (r) { apply(r.theme && r.theme.bg || ""); }).catch(function () { apply(); });
}
// 照片縮小再存（不然太大存不進去）
function bgFromFile(f) {
  var img = new Image(), url = URL.createObjectURL(f);
  img.onload = function () {
    // 要同步的話存小一點（後台空間有限），這台自己用就存大一點
    var max = T.own ? 1400 : 820, w = img.width, h = img.height, k = Math.min(1, max / Math.max(w, h));
    var c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    var q = T.own ? 0.78 : 0.72, data = c.toDataURL("image/jpeg", q);
    while (!T.own && data.length > 300000 && q > 0.35) { q -= 0.1; data = c.toDataURL("image/jpeg", q); }
    T.bg = data; themeSave(true); go("cfg"); toast(T.own ? "背景已換" : "背景已換，其他裝置下次打開也會變");
  };
  img.onerror = function () { toast("這張圖片讀不出來", true); };
  img.src = url;
}
themeApply();
if (window.matchMedia) try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", themeApply); } catch (e) {}
// 從「手機用連結」打開：網址後面帶著後台網址，自動存起來
(function () {
  var m = location.hash.match(/[#&]u=([^&]+)/);
  if (!m) return;
  var u = decodeURIComponent(m[1]);
  if (/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(u)) { S.url = u; store.set("adm_url", u, true); }
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
})();
start();
</script>
